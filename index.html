<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Третя доба</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<script src="scenario.js"></script>
<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var SC = window.SCENARIO;
  var E = window.Engine;
  var app = document.getElementById('app');

  // Тексти інтерфейсу (не зі сценарію)
  var UI = {
    back: 'Назад',
    name: 'Андрій',
    restart: 'Почати знову',
    session1: 'Перша зустріч',
    session2: 'Друга зустріч через тиждень',
    epilogue: 'Через місяць',
    expandAll: 'Розгорнути все',
    collapseAll: 'Згорнути все'
  };

  var GRADE_TEXT = { good: 'вдале рішення', partial: 'частково вдале', error: 'помилка' };

  var FLAG_TEXT = {
    conf: 'Пояснено конфіденційність і її межі',
    stab: 'Клієнт отримав навичку стабілізації',
    norm: 'Реакції нормалізовано',
    support: 'Активовано підтримку (напарник, дружина)',
    screen: 'Зроблено прямий скринінг ризиків',
    safety_plan: 'Складено план безпеки',
    risk_minimized: 'Думки про смерть знецінено',
    escalated: 'Непропорційна ескалація',
    alc_missed: 'Обмовку про алкоголь пропущено',
    alc_unspoken: 'Тему алкоголю закрито порадою',
    label: 'Передчасний діагностичний ярлик',
    retrauma: 'Примушування до детальної розповіді',
    duty_removed: 'Рішення про відсторонення без клієнта',
    plan: 'Домовились про наступну зустріч',
    benzo: 'Призначено транквілізатор',
    avoid: 'Закріплено уникнення',
    tf_started: 'Розпочато КПТ з фокусом на травмі',
    referral: 'Скеровано до психотерапевта',
    followup: 'Призначено контрольну зустріч',
    collusion: 'Зустріч для галочки',
    basic: 'Подбали про базові потреби',
    measure_early: 'Передчасний опитувальник PCL-5',
    group_debrief: 'Груповий дебрифінг',
    monitored: 'Моніторинг динаміки',
    resent: 'Командир привів його вдруге',
    walkout: 'Клієнт пішов раніше (обрив)',
    flash_done: 'Був флешбек'
  };

  // Як прапорець впливає на фінал
  var FLAG_EFFECT = {
    conf: 'змінює реакцію на рекомендацію командирові в N8',
    stab: 'R -1, збудження -1 між зустрічами',
    norm: 'R -1, сором -1 між зустрічами',
    support: 'R -2, збудження -1 між зустрічами',
    screen: 'відкриває N6B, якщо довіра 6 і більше',
    safety_plan: 'суїцидальний ризик у R дорівнює 0',
    risk_minimized: 'суїцидальний ризик у R дорівнює 3, фінал E1 закрито',
    escalated: 'суїцидальний ризик у R дорівнює 0, але довіра обвалюється',
    alc_missed: 'R +2, збудження +1 між зустрічами, фінал E1 закрито',
    alc_unspoken: 'R +2, збудження +1 між зустрічами, фінал E1 закрито',
    label: 'R +1, збудження і сором +1 між зустрічами',
    retrauma: 'R +2 і збудження +1 між зустрічами за кожен раз',
    duty_removed: 'сором +1 між зустрічами',
    plan: 'друга зустріч за домовленістю, довіра +1',
    benzo: 'R +1',
    avoid: 'R +1 за кожен раз',
    tf_started: 'контакт із допомогою',
    referral: 'контакт із допомогою',
    followup: 'контакт із допомогою',
    resent: 'довіра -1 і сором +1 на вході, при довірі 2 і менше фінал E5',
    walkout: 'решту першої зустрічі пропущено'
  };

  var TERM_TEXT = {
    Z: 'Збудження наприкінці',
    retrauma: 'Ретравматизація, по 2 за кожен раз',
    label: 'Діагностичний ярлик',
    alcohol: 'Алкоголь пропущено або тему закрито',
    suicide: 'Суїцидальний ризик (3 якщо знецінено, 0 якщо план безпеки або ескалація, 1 якщо не з\'ясовано)',
    benzo: 'Транквілізатор',
    avoid: 'Уникнення',
    support: 'Підтримка',
    stab: 'Навичка стабілізації',
    norm: 'Нормалізація реакцій'
  };

  var ENDING_RULE = {
    E4: 'R 7 і більше, а контакту з допомогою немає',
    E5: 'командир привів його вдруге, а довіра 2 і менше',
    E1: 'R 3 і менше, ризик не знецінено, алкоголь не пропущено',
    E2: 'R 6 і менше',
    E3: 'R 7 і більше, але є контакт із допомогою'
  };

  var SCALE_NAME = { D: 'Довіра', Z: 'Збудження', S: 'Сором' };

  // Клітинка спрайта і нижня межа голови з шиєю (частка висоти клітинки, виміряно по всіх 15 виразах)
  var CELL_W = 560, CELL_H = 660, HEAD_BOTTOM = 0.69;

  // Стан гри. Кожен перехід кладе в history знімок усього стану (шкали, прапорці, журнал,
  // вирази, черга екранів), тож «Назад» просто відновлює попередній знімок.
  var st, screen, queue, history;
  var L = {};   // поточний макет (layout)

  function h(tag, attrs, children) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') el.textContent = attrs[k];
      else if (k === 'onclick') el.addEventListener('click', attrs[k]);
      else el.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) {
      if (c == null) return;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return el;
  }

  // Клітинка спрайта висотою ch пікселів: повний кадр (crop 1) або верхня частина.
  // Ширина і висота клітинки цілі, тож у кадр не потрапляє смужка сусідньої клітинки
  // (пропорції відхиляються менш ніж на півпікселя).
  function spriteStyle(el, n, ch, crop) {
    ch = Math.round(ch);
    var cw = Math.round(ch * CELL_W / CELL_H);
    var c = (n - 1) % 5, r = Math.floor((n - 1) / 5);
    el.style.width = cw + 'px';
    el.style.height = Math.round(ch * crop) + 'px';
    el.style.backgroundSize = (cw * 5) + 'px ' + (ch * 3) + 'px';
    el.style.backgroundPosition = (-c * cw) + 'px ' + (-r * ch) + 'px';
    el.setAttribute('data-expr', String(n));
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', SC.expressions[String(n)]);
    return el;
  }

  function thumb(n) {
    return spriteStyle(h('div', { 'class': 'thumb' }), n, L.thumb * CELL_H / CELL_W, 0.72);
  }

  // ---------- Черга екранів ----------

  function textScreens(text, face, ctx, node) {
    return E.fragments(text).map(function (f) {
      return { type: 'text', kind: f.kind, text: f.text, face: face, ctx: ctx, node: node || null };
    });
  }

  // Вхід у вузол: фрагменти розповіді (narr_face), фрагменти ситуації (face), меню (face)
  function nodeScreens(id) {
    var node = E.NODE[id];
    var list = textScreens(node.narration, st.narr_face, 'narration', id)
      .concat(textScreens(E.situation(id, st), st.face, 'situation', id));
    var last = list[list.length - 1];
    list.push({ type: 'menu', node: id, face: st.face, kind: last.kind, text: last.text });
    return list;
  }

  function snapshot() {
    return JSON.parse(JSON.stringify({ st: st, screen: screen, queue: queue }));
  }

  function reset() {
    st = E.newState();
    history = [];
    queue = [{ type: 'title', text: UI.session1 }]
      .concat(SC.intro.reduce(function (a, t) { return a.concat(textScreens(t, 1, 'intro')); }, []))
      .concat(nodeScreens('N1'));
    screen = queue.shift();
    render();
  }

  function canGoBack() {
    return history.length > 0;
  }

  function back() {
    if (!canGoBack()) return;
    var snap = history.pop();
    st = snap.st;
    screen = snap.screen;
    queue = snap.queue;
    render();
  }

  // Наступний фрагмент (клік по сцені, пробіл, Enter)
  function advance() {
    if (!screen || (screen.type !== 'text' && screen.type !== 'title') || !queue.length) return;
    history.push(snapshot());
    screen = queue.shift();
    render();
  }

  function pick(idx) {
    if (!screen || screen.type !== 'menu') return;
    var id = screen.node;
    history.push(snapshot());
    var res = E.step(st, id, idx);
    var q = textScreens(res.reply, res.expr, 'reply', id);
    if (res.walkout) q = q.concat(textScreens(SC.walkout.text, res.walkoutFace, 'walkout'));
    if (res.session2) {
      q.push({ type: 'title', text: UI.session2 });
      q = q.concat(textScreens(SC.session2_entry[res.session2].text, res.session2Face, 'session2'));
    }
    if (res.next === null) {
      var end = SC.endings[E.ending(st)];
      q.push({ type: 'title', text: UI.epilogue });
      q = q.concat(textScreens(end.text, end.expr, 'epilogue'));
      q.push({ type: 'debrief' });
    } else {
      q = q.concat(nodeScreens(res.next));
    }
    queue = q;
    screen = queue.shift();
    render();
  }

  // ---------- Макет ----------

  // Усі фрагменти сценарію: за найдовшим визначається стала висота текстового поля
  var ALL_FRAGMENTS = (function () {
    var texts = SC.intro.slice();
    SC.nodes.forEach(function (n) {
      texts.push(n.narration, n.situation);
      (n.situation_by_Z || []).forEach(function (r) { texts.push(r[2]); });
      n.options.forEach(function (o) { texts.push(o.reply, o.reply_then, o.reply_else); });
    });
    texts.push(SC.walkout.text);
    Object.keys(SC.session2_entry).forEach(function (k) { texts.push(SC.session2_entry[k].text); });
    Object.keys(SC.endings).forEach(function (k) { texts.push(SC.endings[k].text); });
    var out = [];
    texts.forEach(function (t) { if (t) out = out.concat(E.fragments(t)); });
    return out;
  })();

  function setVar(name, px) {
    document.documentElement.style.setProperty(name, px + 'px');
  }

  // Шрифти цілими пікселями від розміру вікна; висота поля за найдовшим фрагментом;
  // портрет приблизно 75% висоти вікна, але голова з шиєю завжди над текстовим полем.
  function layout() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var fs = Math.max(18, Math.min(Math.round(vh / 26), Math.round(vw / 46)));
    L = {
      vw: vw, vh: vh, fs: fs,
      fsName: Math.round(fs * 0.86),
      fsOpt: Math.round(fs * 0.86),
      fsTitle: Math.round(fs * 1.6),
      fsUi: Math.max(16, Math.round(fs * 0.72)),
      fsD: Math.max(18, Math.min(Math.round(vh / 32), Math.round(vw / 56))),
      padX: Math.max(16, Math.round(vw * 0.06))
    };
    L.fsH1 = Math.round(L.fsD * 1.7);
    L.fsH2 = Math.round(L.fsD * 1.3);
    L.thumb = Math.round(L.fsD * 3.6);
    setVar('--fs', L.fs);
    setVar('--fs-name', L.fsName);
    setVar('--fs-opt', L.fsOpt);
    setVar('--fs-title', L.fsTitle);
    setVar('--fs-ui', L.fsUi);
    setVar('--fs-d', L.fsD);
    setVar('--fs-h1', L.fsH1);
    setVar('--fs-h2', L.fsH2);
    setVar('--pad-x', L.padX);

    // Висота найдовшого фрагмента в ширині текстового поля
    var probe = h('p', { 'class': 'line' });
    var box = h('div', { 'class': 'textbox' }, [probe]);
    box.style.visibility = 'hidden';
    box.style.height = 'auto';
    document.body.appendChild(box);
    var maxH = 0;
    ALL_FRAGMENTS.forEach(function (f) {
      probe.className = 'line ' + f.kind;
      probe.textContent = f.text;
      maxH = Math.max(maxH, probe.getBoundingClientRect().height);
    });
    document.body.removeChild(box);
    var padTop = Math.round(fs * 0.9), padBottom = Math.round(fs * 1.4);
    L.boxH = Math.ceil(maxH) + padTop + padBottom;
    setVar('--box-h', L.boxH);

    // Портрет
    var limit = vh - L.boxH - Math.round(fs * 0.5);   // нижче цієї лінії голова не опускається
    var ph = Math.round(vh * 0.75);
    var top = Math.round(vh * 0.04);
    if (top + ph * HEAD_BOTTOM > limit) top = Math.round(limit - ph * HEAD_BOTTOM);
    var minTop = Math.round(vh * 0.02);
    if (top < minTop) {
      top = minTop;
      ph = Math.floor((limit - top) / HEAD_BOTTOM);
    }
    if (ph * CELL_W / CELL_H > vw) ph = Math.floor(vw * CELL_H / CELL_W);
    L.portraitH = ph;
    L.portraitTop = top;
    L.headBottom = Math.round(top + ph * HEAD_BOTTOM);
    L.menuW = Math.min(vw - 2 * L.padX, Math.round(fs * 44));
  }

  // ---------- Відображення ----------

  function backButton() {
    return h('button', {
      'class': 'btn-back', type: 'button', 'data-action': 'back',
      onclick: function (ev) { ev.stopPropagation(); back(); }
    }, [h('span', { 'aria-hidden': 'true', text: '←' }), UI.back]);
  }

  function portrait(n) {
    var el = spriteStyle(h('div', { 'class': 'portrait' }), n, L.portraitH, 1);
    el.style.top = L.portraitTop + 'px';
    // Нижній край кадру згасає вже під текстовим полем, щоб крізь нього не просвічувала межа картинки
    var fade = L.vh - L.boxH - L.portraitTop;
    if (fade < L.portraitH) {
      var mask = 'linear-gradient(to bottom, #000 ' + fade + 'px, transparent ' + L.portraitH + 'px)';
      el.style.webkitMaskImage = mask;
      el.style.maskImage = mask;
    }
    return el;
  }

  function textbox(kind, text, more) {
    return h('div', { 'class': 'textbox' }, [
      h('p', { 'class': 'line ' + kind, text: text }),
      more ? h('span', { 'class': 'more', 'aria-hidden': 'true', text: '▼' }) : null
    ]);
  }

  function screenExpr(s) {
    if (s.type === 'text' || s.type === 'menu') return s.face;
    if (s.type === 'debrief') return SC.endings[E.ending(st)].expr;
    return null;
  }

  function render() {
    // Варіант під нерухомим курсором не підсвічується, доки мишу не зрушать
    document.body.classList.add('no-hover');
    var s = screen;
    var expr = screenExpr(s);
    document.body.setAttribute('data-screen', s.type);
    document.body.setAttribute('data-expr', expr === null ? '' : String(expr));
    document.body.setAttribute('data-node', s.node || '');
    document.body.setAttribute('data-ctx', s.ctx || '');
    document.body.setAttribute('data-kind', s.kind || '');
    app.innerHTML = '';
    if (s.type === 'debrief') {
      renderDebrief();
    } else {
      var scene = h('div', { 'class': 'scene' + (s.type === 'menu' ? ' menu-open' : '') });
      scene.addEventListener('click', advance);
      if (s.type === 'title') {
        scene.appendChild(h('div', { 'class': 'title-card' }, [
          h('h1', { text: s.text }), h('div', { 'class': 'rule' })
        ]));
      } else {
        scene.appendChild(portrait(s.face));
        if (s.kind === 'speech') scene.appendChild(h('div', { 'class': 'nameplate', text: UI.name }));
        scene.appendChild(textbox(s.kind, s.text, s.type === 'text'));
      }
      if (s.type === 'menu') {
        scene.appendChild(h('div', { 'class': 'dim' }));
        var menu = h('div', { 'class': 'menu' }, E.NODE[s.node].options.map(function (o, i) {
          return h('button', {
            'class': 'option', type: 'button', 'data-letter': o.letter,
            onclick: function (ev) { ev.stopPropagation(); pick(i); }
          }, [h('span', { 'class': 'letter', text: o.letter }), h('span', { 'class': 'opt-text', text: o.text })]);
        }));
        menu.style.width = L.menuW + 'px';
        menu.style.top = Math.round((L.vh - L.boxH) / 2) + 'px';
        scene.appendChild(menu);
      }
      if (canGoBack()) scene.appendChild(backButton());
      app.appendChild(scene);
    }
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    window.scrollTo(0, 0);
  }

  // ---------- Екран розбору ----------

  function signed(v) {
    return v > 0 ? '+' + v : String(v);
  }

  function scaleRows(before, after) {
    var rows = [];
    ['D', 'Z', 'S'].forEach(function (k) {
      var d = after[k] - before[k];
      var cls = d === 0 ? 'same' : ((k === 'D' ? d > 0 : d < 0) ? 'up' : 'down');
      var arrow = d > 0 ? ' ↑' : (d < 0 ? ' ↓' : '');
      rows.push(h('span', { 'class': 'name', text: SCALE_NAME[k] }));
      rows.push(h('span', { 'class': cls, text: before[k] + ' → ' + after[k] + (d ? '  (' + signed(d) + ')' + arrow : '') }));
    });
    return h('div', { 'class': 'scales' }, rows);
  }

  function flagsText(list) {
    return list.map(function (f) {
      return (FLAG_TEXT[f] || f) + (E.COUNTERS[f] ? ' (' + st.flags[f] + ')' : '');
    }).join(', ');
  }

  function lastSessionOneEntry() {
    var last = null;
    st.log.forEach(function (e) { if (E.NODE[e.node].session === 1) last = e; });
    return last;
  }

  // Точки графіка: старт, кожен вибір, вхід у другу сесію
  function chartPoints() {
    var pts = [{ label: 'старт', v: SC.start }];
    var lastS1 = lastSessionOneEntry();
    st.log.forEach(function (e) {
      pts.push({ label: e.node + ' ' + e.letter, v: e.after });
      if (st.session2 && e === lastS1) pts.push({ label: 'тиждень', v: st.session2.after });
    });
    return pts;
  }

  function renderChart(box) {
    var pts = chartPoints();
    var W = Math.max(700, box.clientWidth - 40), H = Math.round(L.fsD * 9), padL = 40, padR = 40, padT = 12, padB = 12;
    var x = function (i) { return padL + i * (W - padL - padR) / (pts.length - 1); };
    var y = function (v) { return padT + (10 - v) * (H - padT - padB) / 10; };
    var ns = 'http://www.w3.org/2000/svg';
    var svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('width', W);
    svg.setAttribute('height', H);
    svg.setAttribute('aria-hidden', 'true');
    [0, 5, 10].forEach(function (v) {
      var l = document.createElementNS(ns, 'line');
      l.setAttribute('x1', padL); l.setAttribute('x2', W - padR);
      l.setAttribute('y1', y(v)); l.setAttribute('y2', y(v));
      l.setAttribute('stroke', '#cdbfa8'); l.setAttribute('stroke-width', v === 5 ? 1 : 1.5);
      if (v === 5) l.setAttribute('stroke-dasharray', '4 6');
      svg.appendChild(l);
    });
    [['D', '#2c6db3'], ['Z', '#b8392b'], ['S', '#7a4aa6']].forEach(function (k) {
      var p = document.createElementNS(ns, 'polyline');
      p.setAttribute('points', pts.map(function (pt, i) { return x(i) + ',' + y(pt.v[k[0]]); }).join(' '));
      p.setAttribute('fill', 'none'); p.setAttribute('stroke', k[1]); p.setAttribute('stroke-width', 3);
      p.setAttribute('stroke-linejoin', 'round');
      svg.appendChild(p);
      pts.forEach(function (pt, i) {
        var c = document.createElementNS(ns, 'circle');
        c.setAttribute('cx', x(i)); c.setAttribute('cy', y(pt.v[k[0]])); c.setAttribute('r', 4.5);
        c.setAttribute('fill', k[1]);
        svg.appendChild(c);
      });
    });
    var labels = h('div', { 'class': 'chart-labels' }, pts.map(function (pt, i) {
      var s = h('span', { text: pt.label });
      s.style.left = x(i) + 'px';
      return s;
    }));
    labels.style.width = W + 'px';
    var plot = h('div', { 'class': 'chart-plot' }, [svg].concat([0, 5, 10].map(function (v) {
      var l = h('span', { 'class': 'y-label', text: String(v) });
      l.style.top = y(v) + 'px';
      return l;
    })));
    box.appendChild(plot);
    box.appendChild(labels);
  }

  function nodeLabel(e) {
    return e.node + '. ' + E.NODE[e.node].title;
  }

  function stepRow(e, i) {
    var opt = E.NODE[e.node].options[e.idx];
    var a = opt.analysis;
    var body = [
      h('h3', { text: 'До чого це призвело' }), h('p', { text: E.pick(a.result, e.branch) }),
      h('h3', { text: 'Коли доречне, а коли ні' }), h('p', { text: a.when }),
      h('h3', { text: 'Чи доречне тут' }), h('p', { text: a.here })
    ];
    if (e.grade !== 'good' && a.better) body.push(h('h3', { text: 'Кращий варіант' }), h('p', { text: a.better }));
    if (e.flags.length) body.push(h('p', { 'class': 'flags', text: 'Прапорці: ' + flagsText(e.flags) }));
    return h('details', { 'class': 'step', 'data-step': String(i + 1) }, [
      h('summary', null, [
        thumb(e.expr),
        h('div', null, [
          h('p', { 'class': 'node-name' }, [
            h('span', { 'class': 'toggle', 'aria-hidden': 'true', text: '▶' }), nodeLabel(e),
            h('span', { 'class': 'badge ' + e.grade, text: GRADE_TEXT[e.grade] })
          ]),
          h('p', { 'class': 'opt' }, [h('span', { 'class': 'letter-inline', text: opt.letter }), opt.text])
        ]),
        scaleRows(e.before, e.after)
      ]),
      h('div', { 'class': 'body' }, body)
    ]);
  }

  function eventRow(exprN, text, before, after) {
    return h('div', { 'class': 'event' }, [
      thumb(exprN),
      h('div', null, [h('p', { text: text }), before ? scaleRows(before, after) : null])
    ]);
  }

  // Які фінали дала б зміна одного вибору. Подальші вибори лишаються ті самі,
  // а в умовних вузлах, яких не було на цьому шляху, перебираються всі варіанти.
  function alternatives() {
    var letters = {};
    st.log.forEach(function (e) { letters[e.node] = e.idx; });
    var found = {};
    function finish(s, cur, change) {
      while (cur !== null) {
        if (!(cur in letters)) {
          for (var j = 0; j < 3; j++) {
            var s2 = E.cloneState(s);
            finish(s2, E.step(s2, cur, j).next, change);
          }
          return;
        }
        cur = E.step(s, cur, letters[cur]).next;
      }
      var end = E.ending(s);
      if (!found[end]) found[end] = change;
    }
    st.log.forEach(function (e, i) {
      for (var j = 0; j < 3; j++) {
        if (j === e.idx) continue;
        var s = E.newState();
        var cur = 'N1';
        for (var k = 0; k < i; k++) cur = E.step(s, cur, st.log[k].idx).next;
        var nx = E.step(s, cur, j).next;
        finish(s, nx, { node: e.node, from: e.letter, to: E.NODE[e.node].options[j].letter });
      }
    });
    return found;
  }

  function gradeItem(e) {
    var opt = E.NODE[e.node].options[e.idx];
    return h('li', null, [
      h('b', { text: nodeLabel(e) + ', ' + opt.letter + ': ' }), opt.analysis.short,
      e.grade !== 'good' ? h('span', { 'class': 'badge ' + e.grade, text: GRADE_TEXT[e.grade] }) : null
    ]);
  }

  function renderDebrief() {
    var endKey = E.ending(st);
    var end = SC.endings[endKey];
    var r = E.risk(st);
    var root = h('div', { 'class': 'debrief' });
    app.appendChild(root);
    root.appendChild(backButton());
    root.appendChild(h('h1', { text: 'Розбір' }));

    // 1. Що сталося
    root.appendChild(h('h2', { text: 'Що сталося' }));
    root.appendChild(h('div', { 'class': 'summary' }, [
      thumb(end.expr),
      h('div', null, [
        h('p', { 'class': 'ending-title', text: endKey + '. ' + end.title }),
        h('p', { 'class': 'epilogue-text', text: end.text }),
        h('p', { text: end.analysis })
      ])
    ]));

    // 2. Що вдалося і що ні
    var good = st.log.filter(function (e) { return e.grade === 'good'; });
    var other = st.log.filter(function (e) { return e.grade !== 'good'; });
    root.appendChild(h('div', { 'class': 'grade-lists' }, [
      h('div', { 'class': 'list-good' }, [
        h('h2', { text: 'Що вдалося' }),
        good.length ? h('ul', null, good.map(gradeItem)) : h('p', { text: 'Вдалих рішень немає.' })
      ]),
      h('div', { 'class': 'list-other' }, [
        h('h2', { text: 'Що варто було зробити інакше' }),
        other.length ? h('ul', null, other.map(gradeItem)) : h('p', { text: 'Таких рішень немає.' })
      ])
    ]));

    // 3. Як варто було діяти
    root.appendChild(h('h2', { text: 'Як варто було діяти' }));
    root.appendChild(h('p', { text: end.how }));
    root.appendChild(h('p', { 'class': 'best-line', text: SC.debrief_common.best_line }));

    // 4. Хронологія
    root.appendChild(h('h2', { text: 'Хронологія' }));
    var chart = h('div', { 'class': 'chart-box' }, [
      h('div', { 'class': 'legend' }, [
        h('span', { 'class': 'ld' }, [h('b', { text: 'Довіра' })]),
        h('span', { 'class': 'lz' }, [h('b', { text: 'Збудження' })]),
        h('span', { 'class': 'ls' }, [h('b', { text: 'Сором' })])
      ])
    ]);
    root.appendChild(chart);
    renderChart(chart);
    var toggle = h('button', { 'class': 'btn', type: 'button', 'data-action': 'expand-all', text: UI.expandAll });
    root.appendChild(h('div', { 'class': 'steps-tools' }, [toggle]));
    var steps = h('div', { 'class': 'steps' });
    root.appendChild(steps);
    var lastS1 = lastSessionOneEntry();
    st.log.forEach(function (e, i) {
      if (e.node === 'FLASH') steps.appendChild(eventRow(E.NODE.FLASH.entry_expr, 'Флешбек. ' + E.NODE.FLASH.narration));
      steps.appendChild(stepRow(e, i));
      if (e === lastS1 && st.session2) {
        if (st.flags.walkout) steps.appendChild(eventRow(st.walkoutFace, SC.walkout.text));
        var s2 = st.session2;
        steps.appendChild(eventRow(s2.face,
          'Перерахунок за тиждень, потім вхід у другу зустріч. ' + SC.session2_entry[s2.key].text,
          s2.atEnd, s2.after));
      }
    });
    function syncToggle() {
      var all = steps.querySelectorAll('details.step');
      var open = steps.querySelectorAll('details.step[open]');
      toggle.textContent = open.length === all.length ? UI.collapseAll : UI.expandAll;
    }
    toggle.addEventListener('click', function () {
      var all = steps.querySelectorAll('details.step');
      var openAll = steps.querySelectorAll('details.step[open]').length !== all.length;
      Array.prototype.forEach.call(all, function (d) { d.open = openAll; });
      syncToggle();
    });
    steps.addEventListener('toggle', syncToggle, true);

    // 5. Прапорці і ризик
    root.appendChild(h('h2', { text: 'Прапорці і ризик' }));
    var set = Object.keys(st.flags).filter(function (f) { return st.flags[f]; });
    root.appendChild(set.length
      ? h('ul', { 'class': 'flag-list' }, set.map(function (f) {
        return h('li', null, [
          (FLAG_TEXT[f] || f) + (E.COUNTERS[f] ? ': ' + st.flags[f] : ''),
          FLAG_EFFECT[f] ? h('span', { 'class': 'effect', text: ' (' + FLAG_EFFECT[f] + ')' }) : null
        ]);
      }))
      : h('p', { text: 'Жоден прапорець не спрацював.' }));
    root.appendChild(h('h3', { text: 'Як склався індекс ризику R' }));
    var table = h('table', { 'class': 'terms' }, E.riskTerms(st).map(function (t) {
      return h('tr', { 'class': t.value === 0 ? 'zero' : '' }, [
        h('td', { text: TERM_TEXT[t.key] }),
        h('td', { 'class': 'num', text: signed(t.value) })
      ]);
    }).concat([h('tr', { 'class': 'total' }, [h('td', { text: 'R' }), h('td', { 'class': 'num', text: String(r) })])]));
    root.appendChild(table);
    root.appendChild(h('p', { text: 'Контакт із допомогою (контрольна зустріч, скерування або КПТ): ' +
      (E.hasCare(st.flags) ? 'є' : 'немає') + '. Довіра ' + st.D + ', збудження ' + st.Z + ', сором ' + st.S +
      '. Фінал ' + endKey + ', бо ' + ENDING_RULE[endKey] + '.' }));

    // 6. Доказова база
    root.appendChild(h('h2', { text: 'Доказова база' }));
    root.appendChild(h('ol', { 'class': 'evidence' }, SC.debrief_common.evidence.map(function (ev) {
      return h('li', null, [
        h('p', { text: ev.claim }),
        h('p', { 'class': 'source' }, [ev.source + ' ',
          h('a', { href: ev.url, target: '_blank', rel: 'noopener noreferrer', text: ev.url })])
      ]);
    })));

    // 7. Інші можливі фінали
    root.appendChild(h('h2', { text: 'Інші можливі фінали' }));
    var alt = alternatives();
    root.appendChild(h('ul', { 'class': 'other-list' }, ['E1', 'E2', 'E3', 'E4', 'E5'].filter(function (k) {
      return k !== endKey;
    }).map(function (k) {
      var c = alt[k];
      var how = c ? 'Наприклад, якби в ' + c.node + ' обрали ' + c.to + ' замість ' + c.from + '.'
        : 'Зміною лише одного вибору сюди не дійти.';
      return h('li', null, [
        h('span', { 'class': 'ending-name', text: k + '. ' + SC.endings[k].title + '. ' }),
        'Умова: ' + ENDING_RULE[k] + '. ' + how
      ]);
    })));

    root.appendChild(h('div', { 'class': 'restart' }, [
      backButton(),
      h('button', { 'class': 'btn', type: 'button', 'data-action': 'restart', text: UI.restart, onclick: reset })
    ]));
  }

  // ---------- Керування ----------

  document.addEventListener('keydown', function (ev) {
    if (ev.repeat || ev.altKey || ev.ctrlKey || ev.metaKey) return;
    var t = screen && screen.type;
    if (ev.key === 'Backspace') {
      ev.preventDefault();
      back();
      return;
    }
    if (t === 'menu') {
      var n = { '1': 0, '2': 1, '3': 2 }[ev.key];
      if (n !== undefined) { ev.preventDefault(); pick(n); }
    } else if (t === 'text' || t === 'title') {
      if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); advance(); }
    }
  });

  document.addEventListener('mousemove', function () {
    document.body.classList.remove('no-hover');
  });

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      var y = window.scrollY;
      layout();
      if (screen) render();
      window.scrollTo(0, y);
    }, 120);
  });

  // Для автоматичних тестів: знімок стану без доступу до замикання
  window.__novel = {
    state: function () { return JSON.parse(JSON.stringify(st)); },
    screen: function () { return JSON.parse(JSON.stringify(screen)); },
    queueLength: function () { return queue.length; },
    historyLength: function () { return history.length; },
    layout: function () { return JSON.parse(JSON.stringify(L)); }
  };

  layout();
  reset();
})();
</script>
</body>
</html>
